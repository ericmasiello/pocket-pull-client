name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - name: Show build environment
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep "iPhone 17 Pro"

      - name: Build
        run: >
          xcodebuild
          -project "Pocket Pull.xcodeproj"
          -scheme "Pocket Pull"
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          -quiet
          build

      - name: Test
        run: >
          xcodebuild test
          -project "Pocket Pull.xcodeproj"
          -scheme "Pocket Pull"
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          -only-testing:"Pocket PullTests"
          -resultBundlePath TestResults
